# Corre los tests del backend, de los servicios de integración y del frontend en cada pull request
# y en cada push a main.
# Un PR no debería mergearse si alguno de los trabajos falla.
name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    name: Backend (Maven)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    # RabbitMQ de verdad para PublicacionRabbitIntegrationTest; sin RABBITMQ_HOST ese test se saltea.
    services:
      rabbitmq:
        image: rabbitmq:4.1-management
        env:
          RABBITMQ_DEFAULT_USER: reclamos
          RABBITMQ_DEFAULT_PASS: reclamos_ci
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping" --health-interval 10s --health-timeout 5s --health-retries 10
    env:
      RABBITMQ_HOST: localhost
      RABBITMQ_USER: reclamos
      RABBITMQ_PASSWORD: reclamos_ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      # Los tests usan H2 en memoria: no necesitan MySQL ni Docker.
      - name: Tests
        run: ./mvnw -B test
      # Si algo falla, los reportes quedan descargables desde la página de la ejecución.
      - name: Guardar reportes de tests
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reportes-surefire
          path: backend/**/target/surefire-reports/
      # OpenApiTest regenera el contrato de REST 1; queda descargable para commitearlo si cambió.
      - name: Guardar contrato OpenAPI
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: openapi-reclamos
          path: docs/openapi/reclamos.yaml
          if-no-files-found: ignore

  servicios:
    name: Servicios (Maven)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: servicios
    # RabbitMQ y Mailpit de verdad para FlujoCorreoIntegrationTest; sin las variables, ese test se saltea.
    services:
      rabbitmq:
        image: rabbitmq:4.1-management
        env:
          RABBITMQ_DEFAULT_USER: reclamos
          RABBITMQ_DEFAULT_PASS: reclamos_ci
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping" --health-interval 10s --health-timeout 5s --health-retries 10
      mailpit:
        image: axllent/mailpit:latest
        ports:
          - 1025:1025
          - 8025:8025
    env:
      RABBITMQ_HOST: localhost
      RABBITMQ_USER: reclamos
      RABBITMQ_PASSWORD: reclamos_ci
      MAILPIT_URL: http://localhost:8025
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      # Los servicios de integración tienen su propio pom y su propio wrapper de Maven.
      # Algunos tests leen archivos de backend/ y docs/: por eso se hace checkout del repositorio entero.
      - name: Tests
        run: ./mvnw -B -ntp verify
      - name: Guardar reportes de tests
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reportes-surefire-servicios
          path: servicios/**/target/surefire-reports/
      # ServicioSoapHttpTest regenera el WSDL de cobertura; queda descargable para commitearlo si cambió.
      - name: Guardar WSDL de cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wsdl-cobertura
          path: docs/contratos/soap/cobertura.wsdl
          if-no-files-found: ignore
      # OpenApiPrioridadTest regenera el contrato de REST 2.
      - name: Guardar contrato OpenAPI de prioridad
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: openapi-prioridad
          path: docs/openapi/prioridad.yaml
          if-no-files-found: ignore

  frontend:
    name: Frontend (Vitest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Tests
        run: npm test
      - name: Compilación
        run: npm run build
