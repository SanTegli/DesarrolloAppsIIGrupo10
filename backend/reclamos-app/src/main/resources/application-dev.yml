# Perfil dev: MySQL levantado con `docker compose up -d mysql`.
spring:
  datasource:
    url: "${DB_URL:jdbc:mysql://localhost:3306/reclamos?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Argentina/Buenos_Aires&characterEncoding=UTF-8}"
    username: "${DB_USER:reclamos}"
    password: "${DB_PASSWORD:reclamos}"
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false

logging:
  level:
    ar.edu.uade.reclamos: DEBUG
