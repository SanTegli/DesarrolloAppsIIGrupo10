# Perfil dev: MySQL levantado con `docker compose up -d mysql`.
spring:
  datasource:
    url: "${DB_URL:jdbc:mysql://localhost:${DB_PORT:3306}/${DB_NAME:reclamos}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Argentina/Buenos_Aires&characterEncoding=UTF-8}"
    username: "${DB_USER:reclamos}"
    password: "${DB_PASSWORD}"
  sql:
    init:
      mode: always
      encoding: UTF-8
      data-locations: classpath:db/datos-dev.sql
  jpa:
    defer-datasource-initialization: true
    hibernate:
      ddl-auto: update
    show-sql: false

logging:
  level:
    ar.edu.uade.reclamos: DEBUG
