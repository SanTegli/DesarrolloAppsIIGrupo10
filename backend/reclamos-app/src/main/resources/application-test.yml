# Perfil test: H2 en memoria en modo MySQL. Los tests no necesitan Docker.
spring:
  datasource:
    url: "jdbc:h2:mem:reclamos;MODE=MySQL;DB_CLOSE_DELAY=-1"
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false

# Los tests ejecutan el control de vencimientos a mano; la tarea programada queda apagada.
reclamos:
  vencimientos:
    habilitado: false
  # Las fotos de los tests van a un directorio temporal, no al del proyecto.
  fotos:
    directorio: ${java.io.tmpdir}/reclamos-fotos-test
