# Configuración común a todos los perfiles.
# Perfiles: dev (MySQL en Docker, por defecto) y test (H2 en memoria).
spring:
  application:
    name: reclamos-urbanos
  profiles:
    default: dev
  jpa:
    open-in-view: false
  # El backend usa Spring Web Services solo como cliente (CoberturaSoap): no publica servicios SOAP.
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.webservices.WebServicesAutoConfiguration

server:
  port: 8080

# Contrato OpenAPI de REST 1: Swagger UI en /swagger-ui.html, contrato en /v3/api-docs.yaml.
springdoc:
  paths-to-match: /api/**
  swagger-ui:
    path: /swagger-ui.html

# Estrategias activas (patrón Strategy).
reclamos:
  prioridad:
    estrategia: categoria        # categoria | palabras-clave | ia (servicio-prioridad, con respaldo por categoría)
    ia:
      url: http://localhost:8082
      tiempo-conexion: 1s
      tiempo-respuesta: 6s
      circuito:
        llamadas: 5              # si falla la mitad de las últimas 5 llamadas, deja de llamar...
        espera: 30s              # ...durante 30 segundos y después prueba de nuevo
  asignacion:
    estrategia: jurisdiccion     # jurisdiccion | carga-trabajo
  # Control de vencimientos (SLA): cada cuánto se buscan reclamos que pasaron su fecha límite.
  vencimientos:
    habilitado: true
    intervalo-ms: 60000
  # De dónde salen las áreas candidatas para la asignación automática.
  cobertura:
    origen: local                # local (la base del backend) | soap (servicio-cobertura)
    url: http://localhost:8081/ws
    tiempo-limite: 2s            # si el SOAP no contesta a tiempo, el reclamo queda con la asignación pendiente
  # Dirección del reclamo en el mapa (API externa). Si Georef no responde, la ubicación queda pendiente.
  geocodificacion:
    proveedor: georef
    url: https://apis.datos.gob.ar/georef/api/v2.0
    tiempo-conexion: 1s
    tiempo-respuesta: 3s
    max-sugerencias: 5
    cache:
      duracion: 10m              # la misma dirección en el mismo municipio no se vuelve a consultar
      maximo: 500
    # Recuadro aproximado de cada municipio (filtro grueso, no el límite exacto). Un nombre con espacios va
    # entre corchetes: "[Lomas de Zamora]".
    recuadros:
      Quilmes:
        latitud-minima: -34.82
        latitud-maxima: -34.66
        longitud-minima: -58.38
        longitud-maxima: -58.17
