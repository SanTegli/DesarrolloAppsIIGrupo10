# Configuración común a todos los perfiles.
# Perfiles: dev (MySQL en Docker, por defecto) y test (H2 en memoria).
spring:
  application:
    name: reclamos-urbanos
  profiles:
    default: dev
  jpa:
    open-in-view: false
  # RabbitMQ: solo se conecta si reclamos.mensajeria.habilitada es true. Las credenciales salen de .env.
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    publisher-confirm-type: correlated   # un mensaje cuenta como publicado cuando el broker lo confirma
    # El backend también consume: la cola reclamos.prioridad (reevaluación de la prioridad con IA). Un error
    # inesperado se reintenta 3 veces y después el mensaje va a reclamos.prioridad.dlq. Que la IA no responda
    # no es un error: eso se reintenta con la cola de espera (reclamos.prioridad.ia.reevaluacion).
    listener:
      simple:
        default-requeue-rejected: false
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 1s
          multiplier: 2
  # Alta con foto (PR 16): el contenedor corta antes de leer un archivo de más de 5 MB.
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  # El backend usa Spring Web Services solo como cliente (CoberturaSoap): no publica servicios SOAP.
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.webservices.WebServicesAutoConfiguration

server:
  port: 8080
  # Tomcat lee hasta 10 MB de un pedido rechazado por tamaño, así responde 413 en vez de cortar la conexión.
  tomcat:
    max-swallow-size: 10MB
  servlet:
    # Sesión del login: la cookie JSESSIONID es HttpOnly (JavaScript no la lee) y SameSite=Lax (otro sitio no
    # la manda en un POST). Sin actividad, la sesión vence a los 30 minutos.
    session:
      timeout: 30m
      cookie:
        http-only: true
        same-site: lax

# Contrato OpenAPI de REST 1: Swagger UI en /swagger-ui.html, contrato en /v3/api-docs.yaml.
springdoc:
  paths-to-match: /api/**
  swagger-ui:
    path: /swagger-ui.html
    # Swagger UI lee la cookie XSRF-TOKEN y la manda en X-XSRF-TOKEN: así "Try it out" funciona con el login.
    csrf:
      enabled: true

# Estrategias activas (patrón Strategy).
reclamos:
  prioridad:
    estrategia: categoria        # categoria | palabras-clave | ia (servicio-prioridad, con respaldo por categoría)
    ia:
      url: http://localhost:8082
      tiempo-conexion: 1s
      tiempo-respuesta: 4s       # lo que espera el alta: el ciudadano está esperando
      circuito:
        llamadas: 5              # si falla la mitad de las últimas 5 llamadas, deja de llamar...
        espera: 30s              # ...durante 30 segundos y después prueba de nuevo
      # Si la IA no responde en el alta y la mensajería está encendida, el reclamo sale con la prioridad de la
      # categoría (origen PENDIENTE_IA) y la IA lo revisa después, por la cola reclamos.prioridad.
      reevaluacion:
        habilitada: true
        tiempo-respuesta: 10s    # acá nadie espera: se le da más tiempo a la IA
        intentos: 4              # en total; después queda la prioridad de la categoría (RESPALDO)
        espera: 20s              # entre intentos. Si se cambia, borrar la cola reclamos.prioridad.espera
      # PR 26: con la estrategia ia y la mensajería encendida, la IA sugiere la categoría de los reclamos de
      # "Otro problema" por la cola reclamos.categoria, con los mismos tiempos e intentos de la reevaluación.
      sugerir-categoria: true
  asignacion:
    estrategia: jurisdiccion     # jurisdiccion | carga-trabajo
  # Control de vencimientos (SLA): cada cuánto se buscan reclamos que pasaron su fecha límite.
  vencimientos:
    habilitado: true
    intervalo-ms: 60000
  # De dónde salen las áreas candidatas para la asignación automática.
  cobertura:
    origen: local                # local (la base del backend) | soap (servicio-cobertura)
    url: http://localhost:8081/ws
    tiempo-limite: 2s            # si el SOAP no contesta a tiempo, el reclamo queda con la asignación pendiente
  # Límites de uso de los ciudadanos (PR 15).
  uso:
    reclamos-por-dia: ${RECLAMOS_USO_RECLAMOS_POR_DIA:5}
    codigos-por-hora: 3
    vigencia-codigo: 10m
  reaperturas:
    maximo: 1                    # reaperturas directas por reclamo
    plazo: 7d                    # desde la última resolución
  # Verificación del teléfono. simulado: sin bot, un endpoint confirma el código. telegram: necesita el bot.
  telegram:
    modo: ${RECLAMOS_TELEGRAM_MODO:simulado}
    token: ${TELEGRAM_BOT_TOKEN:}
    usuario-bot: ${TELEGRAM_BOT_USUARIO:}
    intervalo-ms: 2000
  # Foto del reclamo (PR 16): JPEG o PNG, re-codificada a JPEG sin metadatos. En Compose, el volumen /data/fotos.
  fotos:
    directorio: ${RECLAMOS_FOTOS_DIRECTORIO:datos/fotos}
    tamano-maximo: 5MB
    lado-maximo: 4000
    calidad: 0.85
  # Posibles duplicados en el alta (PR 17): reclamos abiertos de la misma categoría cerca del punto elegido.
  duplicados:
    radio-metros: 50
    radio-maximo-metros: 200
    maximo-candidatos: 5
    # PR 27: con la estrategia ia, la IA compara el texto del reclamo nuevo con los abiertos cercanos de cualquier
    # categoría (los maximo-comparados más próximos) y marca el que es el mismo problema.
    comparar-con-ia: true
    maximo-comparados: 10
  # Avisos por correo: outbox + RabbitMQ + servicio-notificaciones. Apagada sin broker; Compose la enciende.
  mensajeria:
    habilitada: false
    intervalo-ms: 2000           # cada cuánto se publican los pendientes de la outbox
    lote: 50
    espera-confirmacion: 5s
  # Dirección del reclamo en el mapa (API externa). Si Georef no responde, la ubicación queda pendiente.
  geocodificacion:
    proveedor: georef
    url: https://apis.datos.gob.ar/georef/api/v2.0
    tiempo-conexion: 1s
    tiempo-respuesta: 3s
    max-sugerencias: 10
    cache:
      duracion: 10m              # la misma dirección en el mismo municipio no se vuelve a consultar
      maximo: 500
    # En el alta, Georef confirma en qué municipio cae la ubicación elegida (GET /ubicacion). Si no responde,
    # alcanza el recuadro.
    confirmar-municipio: true
    # Recuadro aproximado de cada municipio (filtro grueso, no el límite exacto). Un nombre con espacios va
    # entre corchetes: "[Lomas de Zamora]".
    recuadros:
      Quilmes:
        latitud-minima: -34.82
        latitud-maxima: -34.66
        longitud-minima: -58.38
        longitud-maxima: -58.17
      Avellaneda:
        latitud-minima: -34.73
        latitud-maxima: -34.62
        longitud-minima: -58.41
        longitud-maxima: -58.24
      Berazategui:
        latitud-minima: -34.92
        latitud-maxima: -34.72
        longitud-minima: -58.28
        longitud-maxima: -58.02
      "[Comuna 13]":
        latitud-minima: -34.59
        latitud-maxima: -34.52
        longitud-minima: -58.50
        longitud-maxima: -58.41
      "[Comuna 14]":
        latitud-minima: -34.61
        latitud-maxima: -34.54
        longitud-minima: -58.46
        longitud-maxima: -58.37
      "[San Isidro]":
        latitud-minima: -34.54
        latitud-maxima: -34.44
        longitud-minima: -58.62
        longitud-maxima: -58.46
