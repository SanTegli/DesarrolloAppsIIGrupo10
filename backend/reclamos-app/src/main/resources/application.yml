# Configuración común a todos los perfiles.
# Perfiles: dev (MySQL en Docker, por defecto) y test (H2 en memoria).
spring:
  application:
    name: reclamos-urbanos
  profiles:
    default: dev
  jpa:
    open-in-view: false
  # RabbitMQ: solo se conecta si reclamos.mensajeria.habilitada es true. Las credenciales salen de .env.
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    publisher-confirm-type: correlated   # un mensaje cuenta como publicado cuando el broker lo confirma
  # El backend usa Spring Web Services solo como cliente (CoberturaSoap): no publica servicios SOAP.
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.webservices.WebServicesAutoConfiguration

server:
  port: 8080
  servlet:
    # Sesión del login: la cookie JSESSIONID es HttpOnly (JavaScript no la lee) y SameSite=Lax (otro sitio no
    # la manda en un POST). Sin actividad, la sesión vence a los 30 minutos.
    session:
      timeout: 30m
      cookie:
        http-only: true
        same-site: lax

# Contrato OpenAPI de REST 1: Swagger UI en /swagger-ui.html, contrato en /v3/api-docs.yaml.
springdoc:
  paths-to-match: /api/**
  swagger-ui:
    path: /swagger-ui.html
    # Swagger UI lee la cookie XSRF-TOKEN y la manda en X-XSRF-TOKEN: así "Try it out" funciona con el login.
    csrf:
      enabled: true

# Estrategias activas (patrón Strategy).
reclamos:
  prioridad:
    estrategia: categoria        # categoria | palabras-clave | ia (servicio-prioridad, con respaldo por categoría)
    ia:
      url: http://localhost:8082
      tiempo-conexion: 1s
      tiempo-respuesta: 6s
      circuito:
        llamadas: 5              # si falla la mitad de las últimas 5 llamadas, deja de llamar...
        espera: 30s              # ...durante 30 segundos y después prueba de nuevo
  asignacion:
    estrategia: jurisdiccion     # jurisdiccion | carga-trabajo
  # Control de vencimientos (SLA): cada cuánto se buscan reclamos que pasaron su fecha límite.
  vencimientos:
    habilitado: true
    intervalo-ms: 60000
  # De dónde salen las áreas candidatas para la asignación automática.
  cobertura:
    origen: local                # local (la base del backend) | soap (servicio-cobertura)
    url: http://localhost:8081/ws
    tiempo-limite: 2s            # si el SOAP no contesta a tiempo, el reclamo queda con la asignación pendiente
  # Límites de uso de los ciudadanos (PR 15).
  uso:
    reclamos-por-dia: ${RECLAMOS_USO_RECLAMOS_POR_DIA:5}
    codigos-por-hora: 3
    vigencia-codigo: 10m
  reaperturas:
    maximo: 1                    # reaperturas directas por reclamo
    plazo: 7d                    # desde la última resolución
  # Verificación del teléfono. simulado: sin bot, un endpoint confirma el código. telegram: necesita el bot.
  telegram:
    modo: ${RECLAMOS_TELEGRAM_MODO:simulado}
    token: ${TELEGRAM_BOT_TOKEN:}
    usuario-bot: ${TELEGRAM_BOT_USUARIO:}
    intervalo-ms: 2000
  # Avisos por correo: outbox + RabbitMQ + servicio-notificaciones. Apagada sin broker; Compose la enciende.
  mensajeria:
    habilitada: false
    intervalo-ms: 2000           # cada cuánto se publican los pendientes de la outbox
    lote: 50
    espera-confirmacion: 5s
  # Dirección del reclamo en el mapa (API externa). Si Georef no responde, la ubicación queda pendiente.
  geocodificacion:
    proveedor: georef
    url: https://apis.datos.gob.ar/georef/api/v2.0
    tiempo-conexion: 1s
    tiempo-respuesta: 3s
    max-sugerencias: 5
    cache:
      duracion: 10m              # la misma dirección en el mismo municipio no se vuelve a consultar
      maximo: 500
    # Recuadro aproximado de cada municipio (filtro grueso, no el límite exacto). Un nombre con espacios va
    # entre corchetes: "[Lomas de Zamora]".
    recuadros:
      Quilmes:
        latitud-minima: -34.82
        latitud-maxima: -34.66
        longitud-minima: -58.38
        longitud-maxima: -58.17
