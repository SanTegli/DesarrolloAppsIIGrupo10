# Desarrollo: solo MySQL corre en Docker. Backend y frontend se ejecutan en la máquina.
#   docker compose up -d mysql
#
# Demo: todos los contenedores. La interfaz queda en http://localhost:5173.
#   docker compose up --build
# Para comprobar que la demo anda de punta a punta, con todo levantado y en otra terminal:
#   docker compose run --rm verificar-demo
# En la demo el backend toma la cobertura del servicio SOAP (WSDL en http://localhost:8081/ws/cobertura.wsdl)
# y la prioridad del servicio de IA (Swagger en http://localhost:8082/swagger-ui.html). Los avisos salen por
# RabbitMQ (consola en http://localhost:15672) y llegan como correo a Mailpit (http://localhost:8025).
services:
  mysql:
    image: mysql:8.4
    container_name: reclamos-mysql
    environment:
      MYSQL_DATABASE: ${DB_NAME:-reclamos}
      MYSQL_USER: ${DB_USER:-reclamos}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Definir DB_PASSWORD en .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Definir MYSQL_ROOT_PASSWORD en .env}
      TZ: America/Argentina/Buenos_Aires
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    ports:
      - "${DB_PORT:-3306}:3306"
    volumes:
      - reclamos-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$MYSQL_PASSWORD\" mysqladmin ping -h localhost -u\"$$MYSQL_USER\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:4.1-management
    container_name: reclamos-rabbitmq
    environment:
      # guest solo puede entrar desde el mismo contenedor: el backend y el consumidor usan este usuario.
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-reclamos}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-reclamos_dev}
    ports:
      - "5672:5672"     # AMQP
      - "15672:15672"   # consola web
    volumes:
      - reclamos-rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Buzón SMTP de prueba: recibe los correos y los muestra en la web. No los entrega a casillas reales.
  mailpit:
    image: axllent/mailpit:latest
    container_name: reclamos-mailpit
    ports:
      - "1025:1025"     # SMTP
      - "8025:8025"     # buzón web

  servicio-notificaciones:
    build:
      context: ./servicios
      dockerfile: servicio-notificaciones/Dockerfile
    container_name: servicio-notificaciones
    depends_on:
      rabbitmq:
        condition: service_healthy
      mailpit:
        condition: service_started
    environment:
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: ${RABBITMQ_USER:-reclamos}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-reclamos_dev}
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      NOTIFICACIONES_DB_URL: jdbc:h2:file:/datos/notificaciones
      # Cada servicio Java con memoria acotada, para que los ocho contenedores entren en una notebook.
      JAVA_TOOL_OPTIONS: -Xmx256m -XX:+UseSerialGC
      TZ: America/Argentina/Buenos_Aires
    volumes:
      - notificaciones-datos:/datos

  servicio-cobertura:
    build:
      context: ./servicios
      dockerfile: servicio-cobertura/Dockerfile
    container_name: servicio-cobertura
    environment:
      JAVA_TOOL_OPTIONS: -Xmx256m -XX:+UseSerialGC
      TZ: America/Argentina/Buenos_Aires
    ports:
      - "8081:8081"
    # Sano cuando Spring Boot ya abrió el puerto. La imagen no trae curl: bash prueba la conexión.
    healthcheck:
      test: ["CMD", "bash", "-c", "</dev/tcp/127.0.0.1/8081"]
      interval: 5s
      timeout: 3s
      retries: 60

  servicio-prioridad:
    build:
      context: ./servicios
      dockerfile: servicio-prioridad/Dockerfile
    container_name: servicio-prioridad
    environment:
      # gemini necesita GEMINI_API_KEY en .env; simulado funciona sin clave, pero no es IA.
      PRIORIDAD_IA_PROVEEDOR: ${PRIORIDAD_IA_PROVEEDOR:-gemini}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      JAVA_TOOL_OPTIONS: -Xmx256m -XX:+UseSerialGC
      TZ: America/Argentina/Buenos_Aires
    ports:
      - "8082:8082"
    # Sano cuando Spring Boot ya abrió el puerto. La imagen no trae curl: bash prueba la conexión.
    healthcheck:
      test: ["CMD", "bash", "-c", "</dev/tcp/127.0.0.1/8082"]
      interval: 5s
      timeout: 3s
      retries: 60

  backend:
    build: ./backend
    container_name: reclamos-backend
    # Espera a que los servicios estén listos: así el primer reclamo de la demo ya pasa por la IA y el SOAP.
    # Si uno se cae después, el backend sigue andando con su respaldo (docs/demo.md, matriz de fallos).
    depends_on:
      mysql:
        condition: service_healthy
      servicio-cobertura:
        condition: service_healthy
      servicio-prioridad:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      DB_URL: "jdbc:mysql://mysql:3306/${DB_NAME:-reclamos}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Argentina/Buenos_Aires&characterEncoding=UTF-8"
      DB_USER: ${DB_USER:-reclamos}
      DB_PASSWORD: ${DB_PASSWORD:?Definir DB_PASSWORD en .env}
      # Entre contenedores se usa el nombre del servicio, no localhost.
      RECLAMOS_COBERTURA_ORIGEN: soap
      RECLAMOS_COBERTURA_URL: http://servicio-cobertura:8081/ws
      RECLAMOS_PRIORIDAD_ESTRATEGIA: ia
      RECLAMOS_PRIORIDAD_IA_URL: http://servicio-prioridad:8082
      RECLAMOS_MENSAJERIA_HABILITADA: "true"
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: ${RABBITMQ_USER:-reclamos}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-reclamos_dev}
      # Verificación del teléfono: "simulado" funciona sin Telegram; "telegram" necesita el token y el usuario
      # del bot en .env. El token nunca va en este archivo ni en Git.
      RECLAMOS_TELEGRAM_MODO: ${RECLAMOS_TELEGRAM_MODO:-simulado}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_BOT_USUARIO: ${TELEGRAM_BOT_USUARIO:-}
      # La demo crea varios reclamos seguidos con la misma cuenta: se sube el límite diario (5 por defecto).
      RECLAMOS_USO_RECLAMOS_POR_DIA: ${RECLAMOS_USO_RECLAMOS_POR_DIA:-20}
      # Fotos de los reclamos (PR 16): en un volumen, así sobreviven a recrear el contenedor.
      RECLAMOS_FOTOS_DIRECTORIO: /data/fotos
      JAVA_TOOL_OPTIONS: -Xmx512m -XX:+UseSerialGC
      TZ: America/Argentina/Buenos_Aires
    volumes:
      - reclamos-fotos:/data/fotos
    ports:
      - "8080:8080"
    # Sano cuando Spring Boot ya abrió el puerto. La imagen no trae curl: bash prueba la conexión.
    healthcheck:
      test: ["CMD", "bash", "-c", "</dev/tcp/127.0.0.1/8080"]
      interval: 5s
      timeout: 3s
      retries: 60

  frontend:
    build: ./frontend
    container_name: reclamos-frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "5173:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
      interval: 5s
      timeout: 3s
      retries: 12

  # Recorre la demo de punta a punta (scripts/verificar-demo.mjs). No arranca con up: se corre a pedido con
  #   docker compose run --rm verificar-demo
  # Crea un reclamo de prueba como Ana Pérez.
  verificar-demo:
    image: node:22-alpine
    profiles: ["verificacion"]
    volumes:
      - ./scripts:/scripts:ro
    command: ["node", "/scripts/verificar-demo.mjs"]
    environment:
      FRONTEND_URL: http://frontend
      BACKEND_URL: http://backend:8080
      COBERTURA_URL: http://servicio-cobertura:8081
      PRIORIDAD_URL: http://servicio-prioridad:8082
      RABBITMQ_API_URL: http://rabbitmq:15672
      RABBITMQ_USER: ${RABBITMQ_USER:-reclamos}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-reclamos_dev}
      MAILPIT_URL: http://mailpit:8025

volumes:
  reclamos-mysql-data:
  reclamos-fotos:
  reclamos-rabbitmq-data:
  notificaciones-datos:
