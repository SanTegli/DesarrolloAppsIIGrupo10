# Contrato de REST 2, servicio de prioridad con IA. Lo implementa servicios/servicio-prioridad (PR 10).
# El PR 26 sumó la segunda operación, /api/categorias/sugerir, y el PR 27 la tercera, /api/duplicados/comparar.
# Este archivo fue el acuerdo de partida; el contrato vigente es el que genera el código en
# docs/openapi/prioridad.yaml (lo regenera OpenApiPrioridadTest) y Swagger UI en http://localhost:8082.
openapi: 3.0.3
info:
  title: Sistema de Reclamos Urbanos — Servicio de prioridad (REST 2)
  version: 1.2.0
  description: >
    Sugiere la prioridad de un reclamo a partir de su categoría y su descripción usando un modelo de
    lenguaje externo (Gemini u OpenAI). También sugiere la categoría de un reclamo cargado como
    "Otro problema" y dice si alguno de los reclamos cercanos es el mismo problema que uno nuevo. No recibe datos personales: ni nombre, ni email, ni DNI, ni dirección, ni foto.
servers:
  - url: http://localhost:8082
paths:
  /api/prioridades/evaluar:
    post:
      summary: Sugerir la prioridad de un reclamo
      operationId: evaluar
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EvaluacionRequest'
            example:
              categoria: Luminaria rota
              descripcion: Poste inclinado con cables expuestos frente a la escuela
      responses:
        '200':
          description: Prioridad sugerida por el modelo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EvaluacionResponse'
              example:
                prioridad: CRITICA
                motivo: Se describe un riesgo eléctrico en un lugar con chicos.
                proveedor: gemini
                modelo: gemini-3.5-flash-lite
        '400':
          description: Entrada inválida (DATOS_INVALIDOS)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '502':
          description: El modelo devolvió una respuesta inválida (RESPUESTA_INVALIDA)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Proveedor caído o sin clave configurada (PROVEEDOR_NO_DISPONIBLE)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '504':
          description: El modelo no respondió a tiempo (TIEMPO_AGOTADO)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/categorias/sugerir:
    post:
      summary: Sugerir la categoría de un reclamo de "Otro problema"
      description: >
        Elige una de las categorías recibidas, o ninguna (categoria null). Es una sugerencia: la
        recategorización la decide un administrador del sistema de reclamos.
      operationId: sugerir
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SugerenciaCategoriaRequest'
            example:
              categoriaPropuesta: Baldosas levantadas
              descripcion: En la vereda de la escuela hay baldosas sueltas y ya se cayó una señora
              categorias: [Luminaria rota, Bache, Residuos, Semáforo averiado, Árbol caído o con riesgo,
                           Pérdida de agua, Vereda rota]
      responses:
        '200':
          description: Categoría sugerida, o null si ninguna corresponde
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SugerenciaCategoriaResponse'
              example:
                categoria: Vereda rota
                motivo: Las baldosas sueltas son un problema de la vereda.
                proveedor: gemini
                modelo: gemini-3.5-flash-lite
        '400':
          description: Entrada inválida (DATOS_INVALIDOS)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '502':
          description: El modelo respondió una categoría que no estaba en la lista (RESPUESTA_INVALIDA)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Proveedor caído, sin clave o sin cuota (PROVEEDOR_NO_DISPONIBLE)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '504':
          description: El modelo no respondió a tiempo (TIEMPO_AGOTADO)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/duplicados/comparar:
    post:
      summary: Comparar un reclamo nuevo con los reclamos abiertos cercanos
      description: >
        El backend manda el reclamo que el vecino está por crear y los reclamos abiertos que encontró a pocos
        metros, de cualquier categoría. Solo texto: categoría y descripción. La respuesta dice cuál describe el
        mismo problema, o ninguno (similar null).
      operationId: comparar
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ComparacionDuplicadosRequest'
            example:
              nuevo: { categoria: Luminaria rota, descripcion: El farol de la esquina no prende hace tres días }
              candidatos:
                - { id: '1', categoria: Bache, descripcion: Pozo enorme en la calle }
                - { id: '2', categoria: Otro problema, descripcion: No hay luz en la esquina, el poste está apagado }
      responses:
        '200':
          description: El id del candidato más parecido, o null si ninguno es el mismo problema
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ComparacionDuplicadosResponse'
              example:
                similar: '2'
                motivo: Los dos hablan del mismo farol apagado en la esquina.
                proveedor: gemini
                modelo: gemini-3.5-flash-lite
        '400':
          description: Entrada inválida o ids repetidos (DATOS_INVALIDOS)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '502':
          description: El modelo eligió un id que no estaba entre los candidatos (RESPUESTA_INVALIDA)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Proveedor caído, sin clave o sin cuota (PROVEEDOR_NO_DISPONIBLE)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '504':
          description: El modelo no respondió a tiempo (TIEMPO_AGOTADO)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
components:
  schemas:
    ComparacionDuplicadosRequest:
      type: object
      required: [nuevo, candidatos]
      properties:
        nuevo:
          type: object
          required: [categoria, descripcion]
          properties:
            categoria: { type: string, maxLength: 80 }
            descripcion: { type: string, maxLength: 1000 }
        candidatos:
          type: array
          minItems: 1
          maxItems: 10
          items:
            type: object
            required: [id, categoria, descripcion]
            properties:
              id: { type: string, maxLength: 20, pattern: '^[A-Za-z0-9_-]+$', description: Lo elige el backend; no se repite }
              categoria: { type: string, maxLength: 80 }
              descripcion: { type: string, maxLength: 1000 }
    ComparacionDuplicadosResponse:
      type: object
      required: [motivo, proveedor, modelo]
      properties:
        similar:
          type: string
          nullable: true
          description: El id de uno de los candidatos; null si ninguno es el mismo problema
        motivo:
          type: string
          maxLength: 300
        proveedor:
          type: string
          enum: [gemini, openai, simulado]
        modelo:
          type: string
    SugerenciaCategoriaRequest:
      type: object
      required: [categoriaPropuesta, descripcion, categorias]
      properties:
        categoriaPropuesta:
          type: string
          maxLength: 80
          description: Lo que escribió el vecino al elegir "Otro problema"
        descripcion:
          type: string
          maxLength: 1000
        categorias:
          type: array
          minItems: 1
          maxItems: 30
          items:
            type: string
            maxLength: 80
    SugerenciaCategoriaResponse:
      type: object
      required: [motivo, proveedor, modelo]
      properties:
        categoria:
          type: string
          nullable: true
          description: Una de las recibidas; null si ninguna corresponde
        motivo:
          type: string
          maxLength: 300
        proveedor:
          type: string
          enum: [gemini, openai, simulado]
        modelo:
          type: string
    EvaluacionRequest:
      type: object
      required: [categoria, descripcion]
      properties:
        categoria:
          type: string
          maxLength: 80
        descripcion:
          type: string
          maxLength: 1000
    EvaluacionResponse:
      type: object
      required: [prioridad, motivo, proveedor, modelo]
      properties:
        prioridad:
          type: string
          enum: [BAJA, MEDIA, ALTA, CRITICA]
        motivo:
          type: string
          maxLength: 300
        proveedor:
          type: string
          enum: [gemini, openai, simulado]
        modelo:
          type: string
    ErrorResponse:
      type: object
      required: [status, codigo, mensaje, detalles, ruta, fecha]
      properties:
        status:
          type: integer
        codigo:
          type: string
        mensaje:
          type: string
        detalles:
          type: array
          items:
            type: string
        ruta:
          type: string
        fecha:
          type: string
          example: '2026-10-26T15:00:00'
