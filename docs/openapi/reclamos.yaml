          description: "No existe el usuario, reclamo, barrio, categoría o área (RECURSO_NO_ENCONTRADO)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: "Regla de negocio o cambio concurrente (REGLA_NEGOCIO, CONFLICTO_CONCURRENTE)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Error inesperado (ERROR_INTERNO)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  schemas:
    CodigoVerificacionResponse:
      type: object
      properties:
        codigo:
          type: string
        enlace:
          type: string
        vence:
          type: string
          format: date-time
        modo:
          type: string
    VerificacionSimuladaRequest:
      type: object
      properties:
        codigo:
          type: string
          example: RU4K7P2Q
          maxLength: 8
          minLength: 0
        telefono:
          type: string
          example: "+5491155550000"
          maxLength: 25
          minLength: 0
      required:
      - codigo
      - telefono
    ReferenciaResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        nombre:
          type: string
    UsuarioResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        nombreCompleto:
          type: string
        rol:
          type: string
          enum:
          - CIUDADANO
          - AGENTE_MUNICIPAL
          - ADMINISTRADOR
          - SISTEMA
        area:
          $ref: "#/components/schemas/ReferenciaResponse"
        telefonoVerificado:
          type: string
        bloqueado:
          type: boolean
    CrearReclamoRequest:
      type: object
      properties:
        categoriaId:
          type: integer
          format: int64
        barrioId:
          type: integer
          format: int64
        descripcion:
          type: string
          maxLength: 1000
          minLength: 0
        direccion:
          type: string
          maxLength: 200
          minLength: 0
        ubicacion:
          $ref: "#/components/schemas/UbicacionElegidaRequest"
      required:
      - barrioId
      - categoriaId
      - descripcion
      - direccion
    UbicacionElegidaRequest:
      type: object
      properties:
        latitud:
          type: number
          format: double
          example: -34.73614578
          maximum: 90
          minimum: -90
        longitud:
          type: number
          format: double
          example: -58.3228998575
          maximum: 180
          minimum: -180
        direccionNormalizada:
          type: string
          example: "GRL BELGRANO 450, Bernal Oeste, Quilmes, Buenos Aires"
          maxLength: 300
          minLength: 0
      required:
      - direccionNormalizada
      - latitud
      - longitud
    HistorialEstadoResponse:
      type: object
      properties:
        estadoAnterior:
          type: string
          enum:
          - INGRESADO
          - ASIGNADO
          - EN_PROCESO
          - RESUELTO
          - CERRADO
          - RECHAZADO
          - CANCELADO
        estadoNuevo:
          type: string
          enum:
          - INGRESADO
          - ASIGNADO
          - EN_PROCESO
          - RESUELTO
          - CERRADO
          - RECHAZADO
          - CANCELADO
        fecha:
          type: string
          format: date-time
        observacion:
          type: string
        usuario:
          $ref: "#/components/schemas/UsuarioReferenciaResponse"
    ReclamoResponse:
      type: object
      properties:
        numero:
          type: string
        descripcion:
          type: string
        direccion:
          type: string
        ubicacion:
          $ref: "#/components/schemas/UbicacionResponse"
        foto:
          type: string
        cantidadApoyos:
          type: integer
          format: int64
        estado:
          type: string
          enum:
          - INGRESADO
          - ASIGNADO
          - EN_PROCESO
          - RESUELTO
          - CERRADO
          - RECHAZADO
          - CANCELADO
        prioridad:
          type: string
          enum:
          - BAJA
          - MEDIA
          - ALTA
          - CRITICA
        origenPrioridad:
          type: string
          enum:
          - CATEGORIA
          - PALABRAS_CLAVE
          - IA
          - RESPALDO
        motivoPrioridad:
          type: string
        vencido:
          type: boolean
        asignacionPendiente:
          type: boolean
        fechaCreacion:
          type: string
          format: date-time
        fechaLimite:
          type: string
          format: date-time
        categoria:
          $ref: "#/components/schemas/ReferenciaResponse"
        barrio:
          $ref: "#/components/schemas/ReferenciaResponse"
        ciudadano:
          $ref: "#/components/schemas/UsuarioReferenciaResponse"
        area:
          $ref: "#/components/schemas/ReferenciaResponse"
        agente:
          $ref: "#/components/schemas/UsuarioReferenciaResponse"
        historial:
          type: array
          items:
            $ref: "#/components/schemas/HistorialEstadoResponse"
        accionesDisponibles:
          type: array
          items:
            type: string
            enum:
            - INGRESADO
            - ASIGNADO
            - EN_PROCESO
            - RESUELTO
            - CERRADO
            - RECHAZADO
            - CANCELADO
          uniqueItems: true
    UbicacionResponse:
      type: object
      properties:
        estado:
          type: string
          enum:
          - CONFIRMADA
          - PENDIENTE
        latitud:
          type: number
          format: double
        longitud:
          type: number
          format: double
        direccionNormalizada:
          type: string
        proveedor:
          type: string
    UsuarioReferenciaResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        nombreCompleto:
          type: string
    ApoyoResponse:
      type: object
      properties:
        numero:
          type: string
        cantidadApoyos:
          type: integer
          format: int64
        apoyado:
          type: boolean
    RegistroRequest:
      type: object
      properties:
        dni:
          type: string
          example: 32111222
          minLength: 1
          pattern: "\\d{7,8}"
        nombre:
          type: string
          example: Laura
          maxLength: 80
          minLength: 0
        apellido:
          type: string
          example: Martínez
          maxLength: 80
          minLength: 0
        email:
          type: string
          format: email
          example: laura@example.org
          maxLength: 254
          minLength: 0
        contrasena:
          type: string
          example: una-clave-larga
          maxLength: 72
          minLength: 8
      required:
      - apellido
      - contrasena
      - dni
      - email
      - nombre
    LoginRequest:
      type: object
      properties:
        email:
          type: string
          example: ana@example.org
          maxLength: 254
          minLength: 0
        contrasena:
          type: string
          example: demo1234
          maxLength: 200
          minLength: 0
      required:
      - contrasena
      - email
    BloqueoRequest:
      type: object
      properties:
        bloqueado:
          type: boolean
      required:
      - bloqueado
    CambiarEstadoRequest:
      type: object
      properties:
        estado:
          type: string
          enum:
          - INGRESADO
          - ASIGNADO
          - EN_PROCESO
          - RESUELTO
          - CERRADO
          - RECHAZADO
          - CANCELADO
        observacion:
          type: string
          maxLength: 1000
          minLength: 0
      required:
      - estado
    AsignarReclamoRequest:
      type: object
      properties:
        areaId:
          type: integer
          format: int64
        observacion:
          type: string
          maxLength: 1000
          minLength: 0
      required:
      - areaId
    SugerenciaUbicacionResponse:
      type: object
      properties:
        direccionNormalizada:
          type: string
          example: "GRL BELGRANO 450, Bernal Oeste, Quilmes, Buenos Aires"
        latitud:
          type: number
          format: double
          example: -34.73614578
        longitud:
          type: number
          format: double
          example: -58.3228998575
    SugerenciasUbicacionResponse:
      type: object
      properties:
        disponible:
          type: boolean
          description: false si el geocodificador no respondió
        sugerencias:
          type: array
          description: Hasta 5 opciones con coordenadas dentro del municipio; vacía
            si no se encontró
          items:
            $ref: "#/components/schemas/SugerenciaUbicacionResponse"
    ResumenReclamoResponse:
      type: object
      properties:
        numero:
          type: string
        direccion:
          type: string
        estado:
          type: string
          enum:
          - INGRESADO
          - ASIGNADO
          - EN_PROCESO
          - RESUELTO
          - CERRADO
          - RECHAZADO
          - CANCELADO
        prioridad:
          type: string
          enum:
          - BAJA
          - MEDIA
          - ALTA
          - CRITICA
        vencido:
          type: boolean
        asignacionPendiente:
          type: boolean
        fechaCreacion:
          type: string
          format: date-time
        fechaLimite:
          type: string
          format: date-time
        categoria:
          $ref: "#/components/schemas/ReferenciaResponse"
        barrio:
          $ref: "#/components/schemas/ReferenciaResponse"
        ciudadano:
          $ref: "#/components/schemas/UsuarioReferenciaResponse"
        area:
          $ref: "#/components/schemas/ReferenciaResponse"
    NotificacionResponse:
      type: object
      properties:
        canal:
          type: string
          enum:
          - EMAIL
          - SMS
          - INTERNO
        destinatario:
          $ref: "#/components/schemas/UsuarioReferenciaResponse"
        mensaje:
          type: string
        fechaEnvio:
          type: string
          format: date-time
    CandidatoDuplicadoResponse:
      type: object
      properties:
        numero:
          type: string
        estado:
          type: string
          enum:
          - INGRESADO
          - ASIGNADO
          - EN_PROCESO
          - RESUELTO
          - CERRADO
          - RECHAZADO
          - CANCELADO
        fechaCreacion:
          type: string
          format: date-time
        descripcion:
          type: string
        direccion:
          type: string
          description: Dirección normalizada por el geocodificador
        foto:
          type: string
          description: Ruta de la foto; null si el reclamo no tiene
        distanciaMetros:
          type: integer
          format: int64
          description: "Distancia al punto elegido, en metros, redondeada"
        cantidadApoyos:
          type: integer
          format: int64
          description: Cuántos vecinos lo apoyan
        apoyadoPorMi:
          type: boolean
          description: Si quien consulta ya lo apoya
        propio:
          type: boolean
          description: "Si lo creó quien consulta: no se puede apoyar"
    AvisoResponse:
      type: object
      properties:
        numeroReclamo:
          type: string
        canal:
          type: string
          enum:
          - EMAIL
          - SMS
          - INTERNO
        mensaje:
          type: string
        fechaEnvio:
          type: string
          format: date-time
    TableroPublicoResponse:
      type: object
      properties:
        desde:
          type: string
          format: date
        hasta:
          type: string
          format: date
        barrioId:
          type: integer
          format: int64
        categoriaId:
          type: integer
          format: int64
        creadosEnPeriodo:
          type: integer
          format: int64
          description: "Reclamos creados en el período, los dos días incluidos"
        pendientes:
          type: integer
          format: int64
          description: "Hoy en INGRESADO, ASIGNADO o EN_PROCESO"
        resueltos:
          type: integer
          format: int64
          description: Hoy en RESUELTO
        cerrados:
          type: integer
          format: int64
          description: Hoy en CERRADO
        rechazados:
          type: integer
          format: int64
        cancelados:
          type: integer
          format: int64
        porcentajeAtendidos:
          type: number
          format: double
          description: "Resueltos y cerrados sobre pendientes, resueltos y cerrados,\
            \ con un decimal; null si no hay ninguno (sin casos)"
    FilaTableroResponse:
      type: object
      properties:
        area:
          $ref: "#/components/schemas/ReferenciaResponse"
          description: null para los reclamos todavía sin área
        barrio:
          $ref: "#/components/schemas/ReferenciaResponse"
        pendientes:
          type: integer
          format: int64
        vencidos:
          type: integer
          format: int64
    TableroGestionResponse:
      type: object
      properties:
        fecha:
          type: string
          format: date-time
        area:
          $ref: "#/components/schemas/ReferenciaResponse"
          description: El área del agente; null para el administrador
        pendientes:
          type: integer
          format: int64
        vencidos:
          type: integer
          format: int64
          description: "Pendientes que pasaron su fecha límite, calculados por fecha"
        sinAsignar:
          type: integer
          format: int64
          description: Pendientes sin área; null para un agente
        porcentajeVencidos:
          type: number
          format: double
          description: "Vencidos sobre pendientes, con un decimal; null sin pendientes\
            \ (sin casos)"
        filas:
          type: array
          description: "Por área y barrio, primero los que tienen más vencidos"
          items:
            $ref: "#/components/schemas/FilaTableroResponse"
    CategoriaResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        nombre:
          type: string
        descripcion:
          type: string
        slaHoras:
          type: integer
          format: int32
        prioridadBase:
          type: string
          enum:
          - BAJA
          - MEDIA
          - ALTA
          - CRITICA
    BarrioResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        nombre:
          type: string
        municipio:
          type: string
    AreaResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        nombre:
          type: string
        activa:
          type: boolean
        categorias:
          type: array
          items:
            $ref: "#/components/schemas/ReferenciaResponse"
        barrios:
          type: array
          items:
            $ref: "#/components/schemas/ReferenciaResponse"
    ErrorResponse:
      properties:
        status:
          type: integer
          format: int32
        codigo:
          type: string
        mensaje:
          type: string
        detalles:
          type: array
          items:
            type: string
        ruta:
          type: string
        fecha:
          type: string
          format: date-time
  securitySchemes:
    sesion:
      type: apiKey
      description: Cookie de sesión que deja POST /api/auth/login
      name: JSESSIONID
      in: cookie
