        "403":
          description: "El rol no puede hacer la operación o el reclamo no es suyo\
            \ (ACCESO_DENEGADO), o falta el token CSRF en un POST o PATCH (CSRF_INVALIDO)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: "No existe el usuario, reclamo, barrio, categoría o área (RECURSO_NO_ENCONTRADO)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: "Regla de negocio o cambio concurrente (REGLA_NEGOCIO, CONFLICTO_CONCURRENTE)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Error inesperado (ERROR_INTERNO)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      tags:
      - Reclamos
      summary: Crear un reclamo con su foto (solo ciudadanos)
      operationId: crear
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                reclamo:
                  $ref: "#/components/schemas/CrearReclamoRequest"
                foto:
                  type: string
                  format: binary
              required:
              - foto
              - reclamo
            encoding:
              reclamo:
                contentType: application/json
      responses:
        "413":
          description: La foto supera el tamaño o las dimensiones (ARCHIVO_DEMASIADO_GRANDE)
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ReclamoResponse"
        "400":
