openapi: 3.1.0
info:
  title: Sistema de Reclamos Urbanos — API de reclamos (REST 1)
  description: "Alta, consulta, cambios de estado y asignación de reclamos urbanos.\
    \ Se entra con POST /api/auth/login: la sesión queda en la cookie JSESSIONID.\
    \ Cada POST y PATCH lleva el encabezado X-XSRF-TOKEN con el valor de la cookie\
    \ XSRF-TOKEN. Fechas en ISO-8601 sin zona horaria."
  version: "3.0"
servers:
- url: http://localhost
  description: Generated server url
security:
- sesion: []
tags:
- name: Reclamos
  description: "Alta, consulta, cambios de estado y asignación"
- name: Verificación del teléfono
  description: Código de un solo uso confirmado por Telegram
- name: Catálogos
  description: "Categorías, barrios y áreas"
- name: Sesión
  description: "Login, registro, usuario actual y cierre de sesión"
- name: Avisos
  description: Bandeja de avisos del usuario
- name: Tableros
  description: "Cifras de reclamos: público y de gestión"
- name: Ubicaciones
  description: Búsqueda de la dirección del reclamo en el mapa (Georef)
- name: Usuarios
  description: "Usuarios del sistema: la lista completa, solo para administradores"
paths:
  /api/verificacion-telefono:
    post:
      tags:
      - Verificación del teléfono
      summary: Pedir un código para verificar el teléfono
      description: "Solo ciudadanos. El código vence a los 10 minutos y se piden hasta\
        \ 3 por hora (429 LIMITE_EXCEDIDO). Con Telegram, el enlace abre el bot con\
        \ el código cargado."
      operationId: iniciar
      responses:
        "201":
          description: Created
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/CodigoVerificacionResponse"
        "400":
          description: Datos inválidos o formato incorrecto (DATOS_INVALIDOS)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Sin sesión (NO_AUTENTICADO) o login fallido (CREDENCIALES_INVALIDAS)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: "El rol no puede hacer la operación o el reclamo no es suyo\
            \ (ACCESO_DENEGADO), o falta el token CSRF en un POST o PATCH (CSRF_INVALIDO)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: "No existe el usuario, reclamo, barrio, categoría o área (RECURSO_NO_ENCONTRADO)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: "Regla de negocio o cambio concurrente (REGLA_NEGOCIO, CONFLICTO_CONCURRENTE)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Error inesperado (ERROR_INTERNO)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/verificacion-telefono/simulada:
    post:
      tags:
      - Verificación del teléfono
      summary: Confirmar el código sin Telegram (solo en modo simulado)
      description: "Para desarrollar y hacer la demo sin bot. Con reclamos.telegram.modo=telegram\
        \ responde 404: el número lo manda Telegram y no se puede escribir a mano."
      operationId: confirmarSimulada
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VerificacionSimuladaRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
