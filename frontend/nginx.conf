# nginx sirve la interfaz y reenvía /api al backend, igual que el proxy de Vite en desarrollo.
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # El alta lleva la foto (hasta 5 MB). Por defecto nginx corta en 1 MB; el backend responde 413 si se pasa.
    client_max_body_size 6m;

    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
    }

    location / {
        try_files $uri /index.html;
    }
}
