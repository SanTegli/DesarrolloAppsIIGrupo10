# Servicio REST 2: prioridad sugerida por IA.
#   POST http://localhost:8082/api/prioridades/evaluar
#   Swagger UI: http://localhost:8082/swagger-ui.html
spring:
  application:
    name: servicio-prioridad

server:
  port: 8082

springdoc:
  paths-to-match: /api/**
  # Las respuestas de error se documentan en el controlador; no se mezclan las del @RestControllerAdvice.
  override-with-generic-response: false
  swagger-ui:
    path: /swagger-ui.html

prioridad:
  ia:
    # gemini (nivel gratuito, sin tarjeta) | openai (pago) | simulado (sin red ni clave; no es IA)
    proveedor: ${PRIORIDAD_IA_PROVEEDOR:gemini}
    # El backend espera 4 s en el alta y 10 s cuando la revisa de nuevo por la cola: con 9 s, una respuesta
    # lenta de Gemini todavía llega a la segunda.
    tiempo-limite: 9s
    instrucciones: classpath:instrucciones-prioridad.txt
    instrucciones-categoria: classpath:instrucciones-categoria.txt   # PR 26: categoría de "Otro problema"
    instrucciones-duplicados: classpath:instrucciones-duplicados.txt # PR 27: ¿algún reclamo cercano es el mismo?
    gemini:
      url: https://generativelanguage.googleapis.com
      clave: ${GEMINI_API_KEY:}
      modelo: ${GEMINI_MODELO:gemini-3.5-flash-lite}
      # minimal | low | medium | high. Más razonamiento es más lento; clasificar una prioridad no lo necesita.
      razonamiento: ${GEMINI_RAZONAMIENTO:minimal}
    openai:
      url: https://api.openai.com
      clave: ${OPENAI_API_KEY:}
      modelo: ${OPENAI_MODELO:gpt-5.4-mini}
